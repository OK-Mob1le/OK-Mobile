<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OK-Mobile Бухгалтерия</title>
<meta name="description" content="OK-Mobile — современная бухгалтерия для вашего бизнеса">
<meta name="theme-color" content="#1677FF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OK-Mobile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link id="app-manifest" rel="manifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231677FF'/%3E%3Ctext x='32' y='42' font-family='Arial' font-size='26' font-weight='bold' fill='white' text-anchor='middle'%3EOK%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   OK-Mobile Бухгалтерия — Design System
   ============================================================ */
:root{
  --primary:#1677FF; --primary-600:#0e63d6; --primary-050:#E8F1FF;
  --navy:#102A56; --navy-2:#0B1E3F;
  --bg:#F5F8FC; --surface:#FFFFFF; --surface-2:#F0F5FB; --surface-3:#E9F0F9;
  --border:#E3EAF3; --border-strong:#D3DEEB;
  --text:#0F1F3D; --muted:#6B7C93; --muted-2:#93A3B8;
  --success:#20C997; --success-bg:#E6FBF5;
  --warning:#FFB020; --warning-bg:#FFF6E5;
  --danger:#FF4D4F; --danger-bg:#FFECEC;
  --info:#1677FF; --info-bg:#E8F1FF;
  --radius:16px; --radius-sm:10px; --radius-lg:22px;
  --shadow:0 8px 24px rgba(16,42,86,.08);
  --shadow-lg:0 18px 48px rgba(16,42,86,.14);
  --shadow-sm:0 2px 8px rgba(16,42,86,.06);
  --sidebar-w:248px; --header-h:68px;
  --sidebar-bg:#102A56; --sidebar-text:#B9C7DD; --sidebar-active:#FFFFFF;
  --glass:rgba(255,255,255,.72);
}
html[data-theme="dark"]{
  --bg:#0B1220; --surface:#121B2E; --surface-2:#18233A; --surface-3:#1F2C48;
  --border:#243352; --border-strong:#2E3F63;
  --text:#E8EEF9; --muted:#8FA3C0; --muted-2:#6C82A3;
  --primary-050:#16273f;
  --success-bg:#0f2f28; --warning-bg:#33260c; --danger-bg:#3a1618; --info-bg:#12233d;
  --shadow:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 18px 48px rgba(0,0,0,.5); --shadow-sm:0 2px 8px rgba(0,0,0,.3);
  --sidebar-bg:#0A1526; --sidebar-text:#93A7C6; --sidebar-active:#FFFFFF;
  --glass:rgba(18,27,46,.78);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .25s ease,color .25s ease;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--muted-2)}
::-webkit-scrollbar-track{background:transparent}
.hidden{display:none!important}

/* ---------- Utility ---------- */
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.bold{font-weight:700}
.center{text-align:center}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}
.grid{display:grid;gap:16px}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:10px 18px;border-radius:12px;font-weight:600;font-size:14px;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
  transition:transform .12s ease,box-shadow .2s ease,background .2s ease,border-color .2s ease;
  white-space:nowrap;
}
.btn:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(22,119,255,.28)}
.btn-primary:hover{background:var(--primary-600);border-color:var(--primary-600)}
.btn-success{background:var(--success);border-color:var(--success);color:#fff}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:10px}
.btn-icon{min-height:42px;width:42px;padding:0;border-radius:12px}
.btn[disabled]{opacity:.55;pointer-events:none}

/* ---------- Inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:13px;font-weight:600;color:var(--muted)}
.input,.select,.textarea{
  width:100%;min-height:46px;padding:11px 14px;border-radius:12px;background:var(--surface);
  border:1px solid var(--border);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;
}
.textarea{min-height:84px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050)}
.input::placeholder{color:var(--muted-2)}
.input-group{display:flex;gap:0}
.input-group .select{border-radius:12px 0 0 12px;border-right:none;max-width:120px;background:var(--surface-2)}
.input-group .input{border-radius:0 12px 12px 0}
.radio-row{display:flex;gap:10px;flex-wrap:wrap}
.radio{
  flex:1;min-width:120px;display:flex;align-items:center;gap:8px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface);cursor:pointer;transition:.2s;font-size:13px;font-weight:500;
}
.radio input{accent-color:var(--primary);width:16px;height:16px}
.radio.checked{border-color:var(--primary);background:var(--primary-050);color:var(--primary);font-weight:600}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge.green{background:var(--success-bg);color:var(--success)}
.badge.yellow{background:var(--warning-bg);color:#B7791F}
.badge.red{background:var(--danger-bg);color:var(--danger)}
.badge.blue{background:var(--info-bg);color:var(--primary)}
.badge.gray{background:var(--surface-3);color:var(--muted)}

/* ---------- Card ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.card-head h3{font-size:16px;font-weight:700}
/* ============================================================
   AUTH
   ============================================================ */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:1.05fr .95fr}
.auth-brand{
  position:relative;overflow:hidden;padding:48px 56px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,#102A56 0%,#123a7a 55%,#1677FF 120%);
}
.auth-brand::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);top:-160px;right:-160px}
.auth-brand::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(32,201,151,.22),transparent 65%);bottom:-180px;left:-120px}
.auth-brand .brand-top{position:relative;z-index:1;display:flex;align-items:center;gap:14px}
.auth-brand .brand-logo{width:56px;height:56px;border-radius:16px;background:#fff;color:#1677FF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.auth-brand h1{font-size:26px;font-weight:800;letter-spacing:.3px}
.auth-brand .tagline{position:relative;z-index:1;margin-top:40px;max-width:440px}
.auth-brand .tagline h2{font-size:34px;line-height:1.2;font-weight:800;margin-bottom:14px}
.auth-brand .tagline p{color:#CFE0F7;font-size:15px;line-height:1.6}
.auth-illus{position:relative;z-index:1;margin:32px 0;display:flex;justify-content:center}
.auth-illus svg{width:100%;max-width:440px;height:auto}
.auth-feats{position:relative;z-index:1;display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:#CFE0F7}
.auth-feats span{display:inline-flex;align-items:center;gap:7px}
.auth-feats svg{width:16px;height:16px;color:#20C997}
.auth-panel{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
.auth-card{width:100%;max-width:460px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:32px;animation:pop .35s ease}
.auth-card.wide{max-width:520px}
.auth-card h2{font-size:23px;font-weight:800;margin-bottom:6px}
.auth-card .sub{color:var(--muted);margin-bottom:22px;font-size:14px}
.lang-switch{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.lang-switch button{padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);transition:.2s}
.lang-switch button.active{background:var(--primary);color:#fff}
.auth-topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps .dot{height:5px;flex:1;border-radius:99px;background:var(--surface-3)}
.steps .dot.active{background:var(--primary)}
.steps .dot.done{background:var(--success)}
.link{color:var(--primary);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}
.tg-icon{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:8px auto 18px;background:linear-gradient(135deg,#29A9EB,#1677FF);color:#fff;box-shadow:0 14px 32px rgba(22,119,255,.35);animation:float 3s ease-in-out infinite}
.tg-icon svg{width:50px;height:50px}
.code-inputs{display:flex;gap:10px;justify-content:center;margin:22px 0}
.code-inputs input{
  width:52px;height:62px;text-align:center;font-size:24px;font-weight:800;border-radius:14px;
  border:2px solid var(--border);background:var(--surface-2);outline:none;transition:.2s;
}
.code-inputs input:focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px var(--primary-050)}
.code-inputs input.filled{border-color:var(--primary)}
.success-anim{width:96px;height:96px;border-radius:50%;background:var(--success-bg);color:var(--success);display:flex;align-items:center;justify-content:center;margin:10px auto 18px;animation:pop .5s ease}
.success-anim svg{width:52px;height:52px;stroke-dasharray:80;stroke-dashoffset:80;animation:draw .7s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ============================================================
   APP SHELL
   ============================================================ */
.shell{display:flex;min-height:100vh;min-height:100dvh}
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;background:var(--sidebar-bg);color:var(--sidebar-text);
  display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;transition:width .22s ease;
}
.sidebar .side-brand{display:flex;align-items:center;gap:12px;padding:20px 20px 16px;color:#fff}
.sidebar .side-brand .mark{width:42px;height:42px;border-radius:12px;background:#fff;color:#1677FF;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0}
.sidebar .side-brand .txt{font-weight:800;font-size:15px;line-height:1.1}
.sidebar .side-brand .txt small{display:block;font-weight:500;font-size:11px;color:var(--sidebar-text);margin-top:2px}
.side-nav{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;gap:2px}
.side-nav::-webkit-scrollbar{width:0}
.side-item{
  display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:11px;color:var(--sidebar-text);
  font-weight:500;font-size:14px;cursor:pointer;transition:.18s;white-space:nowrap;position:relative;
}
.side-item svg{width:20px;height:20px;flex-shrink:0}
.side-item:hover{background:rgba(255,255,255,.08);color:#fff}
.side-item.active{background:linear-gradient(90deg,rgba(22,119,255,.9),rgba(22,119,255,.55));color:#fff;box-shadow:0 8px 20px rgba(22,119,255,.3)}
.side-item .label{transition:opacity .15s}
.side-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.06);cursor:pointer}
.side-user .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#20C997,#1677FF);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.side-user .meta{min-width:0}
.side-user .meta b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user .meta small{color:var(--sidebar-text);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.main{flex:1;min-width:0;margin-left:var(--sidebar-w);display:flex;flex-direction:column;transition:margin .22s ease}

/* Header */
.topbar{
  height:var(--header-h);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:0 22px;background:var(--glass);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);
}
.topbar .menu-btn{display:none}
.search{position:relative;flex:1;max-width:420px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{width:100%;height:44px;padding:0 14px 0 40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);outline:none;transition:.2s}
.search input:focus{background:var(--surface);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-050)}
.search-results{position:absolute;top:52px;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);max-height:380px;overflow-y:auto;z-index:80;padding:6px}
.search-results .sr-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer}
.search-results .sr-item:hover{background:var(--surface-2)}
.search-results .sr-item .ic{width:34px;height:34px;border-radius:9px;background:var(--primary-050);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.search-results .sr-item .ic svg{width:18px;height:18px}
.search-empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;transition:.2s}
.pill:hover{border-color:var(--border-strong);color:var(--text)}
.pill svg{width:16px;height:16px}
.notif-dot{position:relative}
.notif-dot .badge{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.notif-panel{position:absolute;top:60px;right:18px;width:340px;max-width:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);z-index:90;overflow:hidden;animation:pop .2s ease}
.notif-panel h4{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px}
.notif-item{display:flex;gap:11px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.notif-item:hover{background:var(--surface-2)}
.notif-item .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.notif-item .ic svg{width:18px;height:18px}
.notif-item p{font-size:13px;font-weight:600}
.notif-item small{color:var(--muted);font-size:11px}
/* Content */
.content{flex:1;padding:22px;max-width:1600px;width:100%;margin:0 auto;padding-bottom:90px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h1{font-size:22px;font-weight:800;letter-spacing:-.2px}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.page-head .actions{display:flex;gap:8px;flex-wrap:wrap}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);transition:.2s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.stat .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.stat .ic svg{width:20px;height:20px}
.stat .label{color:var(--muted);font-size:12.5px;font-weight:600}
.stat .value{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-top:4px}
.stat .delta{font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;margin-top:6px}
.delta.up{color:var(--success)}.delta.down{color:var(--danger)}

/* Dashboard layout */
.dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;align-items:start}
.chart-filters{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px}
.chart-filters button{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chart-filters button.active{background:var(--primary);color:#fff}
.chart-wrap{position:relative;height:300px;padding:6px}
.chart-legend{display:flex;gap:18px;padding:0 18px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.chart-legend i{width:11px;height:11px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px}
.ops-list{display:flex;flex-direction:column}
.op{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--border)}
.op:last-child{border-bottom:none}
.op .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.op .ic svg{width:19px;height:19px}
.op .meta{flex:1;min-width:0}
.op .meta b{display:block;font-size:13.5px;font-weight:600}
.op .meta small{color:var(--muted);font-size:11.5px}
.op .amt{font-weight:800;font-size:14px;white-space:nowrap}
.op .amt.pos{color:var(--success)}.op .amt.neg{color:var(--danger)}

/* Toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.toolbar .select{min-height:42px;width:auto;min-width:150px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:.2s}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}

/* Table */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm)}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:13px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:13px 16px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:.15s}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.cell-prod{display:flex;align-items:center;gap:11px}
.cell-prod .thumb{width:38px;height:38px;border-radius:10px;background:var(--primary-050);color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cell-prod .thumb svg{width:18px;height:18px}
.cell-prod b{font-weight:600}
.cell-prod small{color:var(--muted);font-size:11.5px;display:block}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.act{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);transition:.2s}
.act:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-050)}
.act.danger:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-bg)}
.act svg{width:16px;height:16px}
.mobile-cards{display:none}

/* Empty */
.empty{padding:54px 20px;text-align:center;color:var(--muted)}
.empty .ic{width:72px;height:72px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--muted-2)}
.empty .ic svg{width:34px;height:34px}
.empty h3{color:var(--text);font-size:16px;margin-bottom:6px}
.empty p{font-size:13px;margin-bottom:16px}

/* Cash cards */
.cash-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.mini-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.mini-stat .label{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:6px}
.mini-stat .value{font-size:19px;font-weight:800}
.mini-stat .value.pos{color:var(--success)}.mini-stat .value.neg{color:var(--danger)}

/* Reports grid */
.report-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.report-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);cursor:pointer;transition:.2s;display:flex;flex-direction:column;gap:10px}
.report-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.report-card .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.report-card .ic svg{width:22px;height:22px}
.report-card b{font-size:14.5px}
.report-card small{color:var(--muted);font-size:12.5px}

/* Settings */
.settings-grid{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start}
.settings-nav{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;box-shadow:var(--shadow-sm);position:sticky;top:88px}
.settings-nav button{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-weight:600;font-size:13.5px;color:var(--muted);text-align:left}
.settings-nav button svg{width:18px;height:18px}
.settings-nav button.active{background:var(--primary-050);color:var(--primary)}
.settings-nav button:hover{background:var(--surface-2)}
.option-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.option-row:last-child{border-bottom:none}
.option-row .info b{display:block;font-size:14px;font-weight:600}
.option-row .info small{color:var(--muted);font-size:12.5px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--primary);color:#fff}
.profile-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.profile-head .avatar{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#20C997,#1677FF);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.info-item{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.info-item small{color:var(--muted);font-size:12px;display:block;margin-bottom:3px}
.info-item b{font-size:14px;font-weight:600}
/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(9,20,40,.55);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .25s ease;overflow:hidden}
.modal.lg{max-width:860px}
.modal.sm{max-width:440px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:17px;font-weight:700}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:16px 20px;border-top:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}
.modal-foot .btn{flex:0 0 auto}
.close-x{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.close-x:hover{background:var(--surface-2);color:var(--text)}
.close-x svg{width:20px;height:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.form-grid .full{grid-column:1/-1}
.line-items{width:100%;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px}
.line-items .li-head,.line-items .li-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;padding:10px 12px;align-items:center}
.line-items .li-head{background:var(--surface-2);font-size:11.5px;text-transform:uppercase;color:var(--muted);font-weight:700;letter-spacing:.3px}
.line-items .li-row{border-top:1px solid var(--border)}
.line-items .li-row input,.line-items .li-row select{min-height:38px;padding:6px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);width:100%;outline:none}
.totals{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.totals .t-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13.5px}
.totals .t-row.grand{border-top:1px dashed var(--border-strong);margin-top:6px;padding-top:10px;font-size:17px;font-weight:800}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- Toast ---------- */
#toast-root{position:fixed;right:20px;bottom:20px;z-index:300;display:flex;flex-direction:column;gap:10px;max-width:calc(100vw - 40px)}
.toast{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:12px;padding:13px 16px;box-shadow:var(--shadow-lg);min-width:260px;animation:slideIn .28s ease;font-size:13.5px;font-weight:500}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
.toast svg{width:20px;height:20px;flex-shrink:0}
.toast.success svg{color:var(--success)}.toast.error svg{color:var(--danger)}.toast.warning svg{color:var(--warning)}.toast.info svg{color:var(--primary)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}

/* ---------- Bottom nav (mobile) ---------- */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;display:none;background:var(--glass);backdrop-filter:blur(16px);border-top:1px solid var(--border);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav .bn-inner{display:flex;justify-content:space-around}
.bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:12px;color:var(--muted);font-size:10.5px;font-weight:600;min-height:52px}
.bn-item svg{width:22px;height:22px}
.bn-item.active{color:var(--primary)}
.bn-item.active svg{filter:drop-shadow(0 3px 6px rgba(22,119,255,.4))}
.drawer-overlay{position:fixed;inset:0;background:rgba(9,20,40,.5);z-index:150;animation:fade .2s ease}
.drawer{position:fixed;left:0;top:0;bottom:0;width:290px;max-width:86vw;background:var(--sidebar-bg);z-index:160;overflow-y:auto;animation:slideRight .25s ease;padding-bottom:20px}
@keyframes slideRight{from{transform:translateX(-100%)}to{transform:none}}
.more-menu{display:flex;flex-direction:column;gap:2px;padding:12px}
.offline-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:140;background:var(--danger);color:#fff;padding:9px 18px;border-radius:999px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg)}
.offline-bar svg{width:16px;height:16px}

/* ---------- Print ---------- */
#print-area{display:none}
@media print{
  body>*{display:none!important}
  #print-area{display:block!important;position:static;padding:0;color:#000;background:#fff}
  @page{margin:14mm}
}
.doc-print{font-family:Inter,Arial,sans-serif;color:#111;max-width:820px;margin:0 auto}
.doc-print .p-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1677FF;padding-bottom:16px;margin-bottom:20px}
.doc-print .p-logo{display:flex;align-items:center;gap:12px}
.doc-print .p-logo .mk{width:52px;height:52px;border-radius:14px;background:#1677FF;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.doc-print .p-logo h2{font-size:20px;margin:0}
.doc-print .p-logo small{color:#555}
.doc-print .p-title{text-align:right}
.doc-print .p-title h1{font-size:24px;color:#102A56;margin-bottom:6px}
.doc-print table{width:100%;border-collapse:collapse;margin:16px 0}
.doc-print th,.doc-print td{border:1px solid #ccd6e4;padding:9px 11px;font-size:13px;text-align:left}
.doc-print th{background:#eef4fd;font-weight:700}
.doc-print .p-total{margin-left:auto;width:280px;margin-top:8px}
.doc-print .p-total .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.doc-print .p-total .r.g{font-weight:800;font-size:18px;border-top:2px solid #1677FF;margin-top:6px;padding-top:10px}
.doc-print .p-sign{display:flex;justify-content:space-between;margin-top:56px}
.doc-print .p-sign div{border-top:1px solid #333;padding-top:8px;width:220px;font-size:13px}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1200px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .dash-grid{grid-template-columns:1.4fr 1fr}
  .cash-grid{grid-template-columns:repeat(2,1fr)}
  .report-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:992px){
  :root{--sidebar-w:76px}
  .sidebar .side-brand .txt{display:none}
  .sidebar .side-brand{justify-content:center;padding:18px 8px 12px}
  .sidebar .side-item{justify-content:center;padding:12px 8px}
  .sidebar .side-item .label{display:none}
  .side-user .meta{display:none}
  .side-user{justify-content:center}

  .sidebar:hover .side-brand .txt{display:block}
  .sidebar:hover .side-brand{justify-content:flex-start;padding:20px 20px 16px}
  .sidebar:hover .side-item{justify-content:flex-start;padding:11px 12px}
  .sidebar:hover .side-item .label{display:block}
  .sidebar:hover .side-user .meta{display:block}

  .auth{grid-template-columns:1fr}
  .auth-brand{display:none}
}
@media (max-width:768px){
  :root{--header-h:60px}
  .sidebar{display:none}
  .main{margin-left:0}
  .topbar{padding:0 14px;gap:10px}
  .topbar .menu-btn{display:inline-flex}
  .search{max-width:none}
  .top-actions .hide-mobile{display:none}
  .content{padding:14px;padding-bottom:88px}
  .bottom-nav{display:block}
  .stats{grid-template-columns:repeat(2,1fr);gap:11px}
  .stat{padding:13px}
  .stat .value{font-size:17px}
  .dash-grid{grid-template-columns:1fr}
  .page-head h1{font-size:19px}
  .page-head .actions{width:100%}
  .page-head .actions .btn{flex:1}
  .settings-grid{grid-template-columns:1fr}
  .settings-nav{position:static;flex-direction:row;overflow-x:auto}
  .settings-nav button{white-space:nowrap}
  .report-grid{grid-template-columns:1fr}
  .cash-grid{grid-template-columns:1fr 1fr}
  .info-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .code-inputs input{width:44px;height:54px;font-size:20px}
  .table-wrap{background:transparent;border:none;box-shadow:none;overflow:visible}
  table.tbl{display:none}
  .mobile-cards{display:flex;flex-direction:column;gap:11px}

  .m-card .m-row span:first-child{color:var(--muted)}

  .modal-overlay{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:22px 22px 0 0;max-height:94vh}
  .modal-foot{position:sticky;bottom:0}
  .modal-foot .btn{flex:1}
  .line-items .li-head{display:none}
  .line-items .li-row{grid-template-columns:1fr 1fr;gap:8px}
  #toast-root{right:12px;left:12px;bottom:88px;max-width:none}

}
@media (max-width:480px){

  .auth-card h2{font-size:20px}

}
@media (max-width:360px){
  .code-inputs input{width:38px;height:48px;font-size:17px}
}

/* ============================================================
   OK-Mobile 2026 — Premium Design Layer
   Переопределения поверх базовой системы. Логика не затрагивается.
   ============================================================ */
:root{
  /* Motion system */
  --ease-standard:cubic-bezier(.4,0,.2,1);
  --ease-smooth:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.34,1.4,.64,1);
  --duration-fast:120ms; --duration-normal:200ms; --duration-slow:320ms;
  /* Extended palette */
  --primary-hover:#0e63d6; --primary-soft:#E8F1FF; --primary-ultra:#F3F8FF;
  --violet:#7C3AED; --violet-bg:#F1EBFE;
  --emerald:#10B981; --emerald-bg:#E7F9F2;
  --amber:#F59E0B; --amber-bg:#FEF4E4;
  --rose:#EF4444; --rose-bg:#FEECEC;
  --surface-elevated:#FFFFFF; --surface-hover:#F7FAFE;
  --text-primary:#0F1F3D; --text-secondary:#5A6B85; --text-muted:#93A3B8;
  --ring:0 0 0 4px rgba(22,119,255,.14);
  --shadow-xs:0 1px 2px rgba(16,42,86,.05);
  --shadow-md:0 10px 30px -12px rgba(16,42,86,.22);
  --shadow-glow:0 12px 34px -10px rgba(22,119,255,.42);
}
html[data-theme="dark"]{
  --primary-soft:#16273f; --primary-ultra:#111d31;
  --violet-bg:#241a3d; --emerald-bg:#0f2f28; --amber-bg:#33260c; --rose-bg:#3a1618;
  --surface-elevated:#18233A; --surface-hover:#1c2941;
  --text-primary:#E8EEF9; --text-secondary:#A6B6D0; --text-muted:#6C82A3;
  --shadow-xs:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 14px 36px -16px rgba(0,0,0,.7);
  --shadow-glow:0 14px 36px -12px rgba(22,119,255,.5);
}
body{background:
  radial-gradient(1100px 520px at 100% -10%, color-mix(in srgb, var(--primary) 6%, transparent), transparent 60%),
  var(--bg);
  color:var(--text-primary);
}

/* ---------- Focus & a11y ---------- */
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:8px}
.btn:focus-visible,.input:focus-visible,.select:focus-visible,.textarea:focus-visible{outline:none;box-shadow:var(--ring)}
::selection{background:color-mix(in srgb, var(--primary) 26%, transparent)}

/* ---------- Buttons (premium) ---------- */
.btn{
  position:relative;overflow:hidden;border-radius:12px;font-weight:600;
  transition:transform var(--duration-fast) var(--ease-standard),
             box-shadow var(--duration-normal) var(--ease-standard),
             background-color var(--duration-normal) var(--ease-standard),
             border-color var(--duration-normal) var(--ease-standard),color var(--duration-normal) var(--ease-standard);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.975)}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.35), transparent 65%);
  opacity:0;transition:opacity var(--duration-slow) var(--ease-standard)}
.btn:active::after{opacity:1;transition:opacity 60ms linear}
.btn-primary{background:linear-gradient(135deg,#3b90ff 0%,#1677FF 52%,#0e63d6 100%);
  border-color:transparent;box-shadow:var(--shadow-glow)}
.btn-primary:hover{box-shadow:0 16px 40px -10px rgba(22,119,255,.55)}
.btn-success{background:linear-gradient(135deg,#2fd6a3,#10B981);border-color:transparent;box-shadow:0 12px 30px -12px rgba(16,185,129,.6)}
.btn-danger{background:linear-gradient(135deg,#ff6b6d,#EF4444);border-color:transparent;box-shadow:0 12px 30px -12px rgba(239,68,68,.55)}
.btn-icon{background:var(--surface);border:1px solid var(--border)}
.btn-icon:hover{background:var(--surface-hover);border-color:var(--border-strong);transform:translateY(-1px)}
.btn:not(.btn-primary):not(.btn-success):not(.btn-danger):hover{background:var(--surface-hover)}
/* Loading & success states */
.btn.loading{pointer-events:none;color:transparent!important}
.btn.loading::before{content:"";position:absolute;width:16px;height:16px;border-radius:50%;
  border:2px solid currentColor;border-top-color:transparent;color:#fff;animation:spin .7s linear infinite}
.btn.success{background:linear-gradient(135deg,#2fd6a3,#10B981);border-color:transparent;color:#fff}

/* ---------- Inputs ---------- */
.input,.select,.textarea{transition:border-color var(--duration-normal) var(--ease-standard),
  box-shadow var(--duration-normal) var(--ease-standard),background-color var(--duration-normal) var(--ease-standard)}
.input:hover,.select:hover,.textarea:hover{border-color:var(--border-strong)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);box-shadow:var(--ring)}
.field>label{transition:color var(--duration-normal) var(--ease-standard)}
.field:focus-within>label{color:var(--primary)}
.input.error,.select.error{border-color:var(--danger);animation:shake .32s var(--ease-standard)}
.input.valid{border-color:var(--success)}
.radio{transition:border-color var(--duration-normal) var(--ease-standard),background-color var(--duration-normal) var(--ease-standard),transform var(--duration-fast) var(--ease-standard)}
.radio:hover{border-color:var(--border-strong)}
.radio.checked{box-shadow:0 0 0 3px var(--primary-soft)}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-xs);
  transition:box-shadow var(--duration-normal) var(--ease-standard),border-color var(--duration-normal) var(--ease-standard)}
.card-head h3{letter-spacing:-.2px}

/* ---------- Badges ---------- */
.badge{letter-spacing:.1px;transition:transform var(--duration-fast) var(--ease-standard)}
.badge.green{background:var(--emerald-bg);color:#0f9d6b}
.badge.yellow{background:var(--amber-bg);color:#b3760a}
.badge.red{background:var(--rose-bg);color:#d93a3c}
.badge.blue{background:var(--primary-soft);color:var(--primary)}
.badge.gray{background:var(--surface-3);color:var(--text-secondary)}
html[data-theme="dark"] .badge.green{color:#34d3a0}
html[data-theme="dark"] .badge.yellow{color:#f0b64c}
html[data-theme="dark"] .badge.red{color:#ff7072}
html[data-theme="dark"] .badge.blue{color:#6aa8ff}

/* ============================================================
   SIDEBAR — modern SaaS navigation
   ============================================================ */
.sidebar{
  background:linear-gradient(185deg,#122E5C 0%,var(--sidebar-bg) 45%,#0B1E3F 100%);
  border-right:1px solid rgba(255,255,255,.06);
}
html[data-theme="dark"] .sidebar{background:linear-gradient(185deg,#0d1c33 0%,#0A1526 55%,#070f1c 100%)}
.side-nav{position:relative}
.side-item{position:relative;z-index:1;border-radius:11px;
  transition:background-color var(--duration-normal) var(--ease-standard),color var(--duration-normal) var(--ease-standard)}
.side-item svg{transition:transform var(--duration-normal) var(--ease-spring)}
.side-item:hover{background:rgba(255,255,255,.07);color:#fff}
.side-item:hover svg{transform:scale(1.08)}
.side-item.active{background:transparent;color:#fff;box-shadow:none}

.report-grid>*:nth-child(5){animation-delay:160ms}

/* ---------- Ops list ---------- */
.op{transition:background-color var(--duration-fast) var(--ease-standard)}

/* ---------- Tables ---------- */

/* ---------- Bottom nav (mobile) ---------- */

.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:75;width:56px;height:56px;border-radius:18px;display:none;

@media (max-width:768px){.fab{display:flex}}

/* ================= UTILS ================= */
function t(key, vars){
  const lang = state.lang || 'ru';
  let str = (translations[lang] && translations[lang][key]) || (translations.ru[key]) || key;
  if(vars){ for(const k in vars){ str = str.split('{'+k+'}').join(vars[k]); } }
  return str;
}
function curInfo(code){ return CURRENCIES[code] || CURRENCIES.TJS; }
function fmtMoney(amount, currency){
  currency = currency || state.currency;
  const info = curInfo(currency);
  const n = Number(amount || 0);
  const formatted = n.toLocaleString('ru-RU', {minimumFractionDigits:0, maximumFractionDigits:2});
  return info.pos === 'before' ? (info.symbol + formatted) : (formatted + ' ' + info.symbol);
}
function fmtNum(n){ return Number(n||0).toLocaleString('ru-RU'); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtDate(iso, withTime){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const base = pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
  return withTime ? base+' '+pad(d.getHours())+':'+pad(d.getMinutes()) : base;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowISO(){ return new Date().toISOString(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, ms){ let tm; return function(){ const a=arguments, c=this; clearTimeout(tm); tm=setTimeout(()=>fn.apply(c,a), ms||200); }; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function statusOf(p){
  const q = Number(p.quantity||0), min = Number(p.min_quantity||0);
  if(q <= 0) return {key:'out', cls:'red', label:t('status.out')};
  if(q <= min) return {key:'low', cls:'yellow', label:t('status.low')};
  return {key:'in', cls:'green', label:t('status.inStock')};
}
function paymentLabel(m){ return t('pay.'+(m||'cash')); }
function docTypeLabel(type){ return t('doctype.'+(type||'sale')); }

function persist(){
  try{
    localStorage.setItem('okmobile_state', JSON.stringify({
      lang: state.lang, theme: state.theme, currency: state.currency,
      token: state.token, user: state.user, company: state.company
    }));
  }catch(e){}
}
function restore(){
  try{
    const raw = localStorage.getItem('okmobile_state');
    if(raw){
      const s = JSON.parse(raw);
      if(s.lang) state.lang = s.lang;
      if(s.theme) state.theme = s.theme;
      if(s.currency) state.currency = s.currency;
      if(s.token) state.token = s.token;
      if(s.user) state.user = s.user;
      if(s.company) state.company = s.company;
    }
    const apib = localStorage.getItem('okmobile_apibase');
    if(apib) CONFIG.API_BASE = apib;
  }catch(e){}
}

/* ================= LOCAL STORE (демо-движок) ================= */
const Local = {
  key: 'okmobile_db_v1',
  db: null,
  load(){
    if(this.db) return this.db;
    try{ const raw = localStorage.getItem(this.key); if(raw){ this.db = JSON.parse(raw); return this.db; } }catch(e){}
    this.db = this.seed(); this.save(); return this.db;
  },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.db)); }catch(e){} },
  reset(){ this.db = this.seed(); this.save(); },
  nextId(coll){ const arr = this.db[coll]||[]; return arr.reduce((m,x)=>Math.max(m, x.id||0), 0) + 1; },
  list(coll){ this.load(); return (this.db[coll]||[]).slice().sort((a,b)=> (b.id||0)-(a.id||0)); },
  insert(coll, obj){ this.load(); obj.id = this.nextId(coll); obj.created_at = obj.created_at || nowISO(); (this.db[coll]=this.db[coll]||[]).push(obj); this.save(); return obj; },
  update(coll, id, patch){ this.load(); const arr=this.db[coll]||[]; const i=arr.findIndex(x=>x.id===Number(id)); if(i<0) return null; arr[i]=Object.assign({},arr[i],patch,{updated_at:nowISO()}); this.save(); return arr[i]; },
  remove(coll, id){ this.load(); const arr=this.db[coll]||[]; const i=arr.findIndex(x=>x.id===Number(id)); if(i<0) return false; arr.splice(i,1); this.save(); return true; },
  find(coll, id){ this.load(); return (this.db[coll]||[]).find(x=>x.id===Number(id)) || null; },

/* ================= BUSINESS LOGIC ================= */
function computeDashboard(){
  const d = state.data;
  const sales = d.sales.reduce((s,x)=>s+Number(x.total||0),0);
  const purchases = d.purchases.reduce((s,x)=>s+Number(x.total||0),0);
  const expenses = d.cash.filter(c=>c.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
  const profit = sales - expenses;
  const products = d.products.reduce((s,x)=>s+Number(x.quantity||0),0);
  const debts = d.customers.reduce((s,x)=>s+Math.max(0,Number(x.balance||0)),0);
  return {sales, purchases, expenses, profit, products, debts,
    deltas:{sales:12, purchases:8, expenses:-3, profit:15, products:5, debts:-2}};
}
function computeCash(){
  const d = state.data;
  const income = d.cash.filter(c=>c.type==='income').reduce((s,x)=>s+Number(x.amount||0),0);
  const expense = d.cash.filter(c=>c.type==='expense').reduce((s,x)=>s+Number(x.amount||0),0);
  const byMethod = {cash:0, card:0, bank:0, other:0};
  d.cash.forEach(c=>{ const m=c.method||'cash'; byMethod[m]=(byMethod[m]||0)+(c.type==='income'?Number(c.amount||0):-Number(c.amount||0)); });
  return {balance: income-expense, income, expense, byMethod};
}
const MONTHS = {
  ru:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],
  tj:['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'],
  en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']
};
const WEEKDAYS = {
  ru:['Вс','Пн','Вт','Ср','Чт','Пт','Сб'],
  tj:['Яш','Дш','Сш','Чш','Пш','Ҷм','Шн'],
  en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat']
};
function computeChart(period){
  const d = state.data;
  const now = new Date();
  let buckets = [];
  const mk = (label, from, to) => ({label, from, to, sales:0, expenses:0});
  if(period==='year'){
    for(let m=0;m<12;m++){ buckets.push(mk(MONTHS[state.lang][m], new Date(now.getFullYear(),m,1), new Date(now.getFullYear(),m+1,1))); }
  } else if(period==='month'){
    for(let i=29;i>=0;i--){ const dt=new Date(now); dt.setDate(now.getDate()-i); const from=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()); const to=new Date(from); to.setDate(from.getDate()+1); buckets.push(mk(pad(from.getDate())+'.'+pad(from.getMonth()+1), from, to)); }
  } else if(period==='week'){
    for(let i=6;i>=0;i--){ const dt=new Date(now); dt.setDate(now.getDate()-i); const from=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()); const to=new Date(from); to.setDate(from.getDate()+1); buckets.push(mk(WEEKDAYS[state.lang][from.getDay()], from, to)); }
  } else {
    for(let i=7;i>=0;i--){ const from=new Date(now); from.setHours(now.getHours()-i*3,0,0,0); const to=new Date(from); to.setHours(from.getHours()+3); buckets.push(mk(pad(from.getHours())+':00', from, to)); }
  }
  d.sales.forEach(s=>{ const dt=new Date(s.created_at); buckets.forEach(b=>{ if(dt>=b.from && dt<b.to) b.sales+=Number(s.total||0); }); });
  d.cash.filter(c=>c.type==='expense').forEach(c=>{ const dt=new Date(c.created_at); buckets.forEach(b=>{ if(dt>=b.from && dt<b.to) b.expenses+=Number(c.amount||0); }); });
  buckets.forEach(b=> b.profit = b.sales - b.expenses);
  return {labels:buckets.map(b=>b.label), sales:buckets.map(b=>b.sales), expenses:buckets.map(b=>b.expenses), profit:buckets.map(b=>b.profit)};
}
function computeReports(){
  const d = state.data;
  const dash = computeDashboard();
  const cash = computeCash();
  return {
    sales: {count:d.sales.length, total:dash.sales},
    purchases: {count:d.purchases.length, total:dash.purchases},
    warehouse: {count:d.products.length, qty:dash.products, value:d.products.reduce((s,p)=>s+Number(p.quantity||0)*Number(p.sale_price||0),0)},
    profit: {sales:dash.sales, expenses:dash.expenses, profit:dash.profit},
    expenses: {total:dash.expenses},
    customerDebts: {total:dash.debts, items:d.customers.filter(c=>Number(c.balance||0)>0)},
    supplierDebts: {total:d.suppliers.reduce((s,x)=>s+Math.max(0,Number(x.balance||0)),0), items:d.suppliers.filter(s=>Number(s.balance||0)>0)},
    cashflow: cash,
    dealers: {count:d.dealers.length, active:d.dealers.filter(x=>x.status==='active').length}
  };
}
function buildNotifications(){
  const out = [];
  state.data.products.forEach(p=>{
    const st = statusOf(p);
    if(st.key==='out') out.push({type:'out', icon:'box', cls:'red', title:t('notif.outStock'), text:p.name, date:p.updated_at||p.created_at});
    else if(st.key==='low') out.push({type:'low', icon:'alert', cls:'yellow', title:t('notif.lowStock'), text:p.name+' · '+fmtNum(p.quantity), date:p.updated_at||p.created_at});
  });
  state.data.customers.forEach(c=>{ if(Number(c.balance||0)>0) out.push({type:'debt', icon:'users', cls:'red', title:t('notif.debt'), text:c.name+' · '+fmtMoney(c.balance), date:c.updated_at||c.created_at}); });
  state.data.sales.slice(0,3).forEach(s=> out.push({type:'pay', icon:'wallet', cls:'green', title:t('notif.payment'), text:(s.customer_name||'')+' · '+fmtMoney(s.total, s.currency), date:s.created_at}));
  return out.slice(0,10);
}

/* ================= API LAYER ================= */
const Api = {
  base(){ return (CONFIG.API_BASE||'').replace(/\/$/,''); },
  enabled(){ return !!this.base(); },
  async request(path, opts){
    opts = opts || {};
    const headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{});
    if(state.token) headers['Authorization'] = 'Bearer '+state.token;
    const res = await fetch(this.base()+path, {method:opts.method||'GET', headers, body: opts.body?JSON.stringify(opts.body):undefined});
    let data = null; try{ data = await res.json(); }catch(e){}
    if(!res.ok){ const err = new Error((data && data.error) || ('HTTP '+res.status)); err.code = data && data.code; err.status = res.status; throw err; }
    return data;
  }
};
function useApi(){ return Api.enabled() && !!state.token; }
function wrapApi(promise, fallback){
  return promise.catch(err=>{
    if(CONFIG.DEMO_FALLBACK){ console.warn('API fallback:', err.message); return fallback(); }
    throw err;
  });
}

Local.createSale = function(payload){
  this.load();
  const items = payload.items||[];
  if(!items.length) throw new Error(t('errors.required'));
  for(const it of items){
    const p = this.find('products', it.product_id);
    if(!p) throw new Error(t('errors.notFound'));
    if(Number(p.quantity||0) < Number(it.quantity||0)) throw new Error(t('errors.insufficient')+': '+p.name);
  }
  const subtotal = items.reduce((s,it)=>s+Number(it.price||0)*Number(it.quantity||0),0);
  const discount = Number(payload.discount||0);
  const tax = Number(payload.tax||0);
  const total = Math.max(0, subtotal - discount + tax);
  items.forEach(it=>{
    const p = this.find('products', it.product_id);
    this.update('products', p.id, {quantity: Number(p.quantity||0) - Number(it.quantity||0)});
    it.total = Number(it.price||0)*Number(it.quantity||0);
    it.name = it.name || p.name;
  });
  const sale = this.insert('sales', {
    customer_id: payload.customer_id||null, customer_name: payload.customer_name||'',
    subtotal, discount, tax, total, currency: payload.currency||state.currency,
    payment_method: payload.payment_method||'cash', comment: payload.comment||'', items
  });
  this.insert('cash', {type:'income', method: payload.payment_method||'cash', amount: total, currency: sale.currency, description:'Продажа #'+sale.id, created_at: nowISO()});
  this.insert('documents', {type:'sale', number:'SALE-'+String(1000+sale.id), date: todayISO(), party: sale.customer_name||'—', total, currency: sale.currency, status:'paid', created_by: (state.user&&state.user.name)||'—'});
  if(sale.customer_id){
    const c = this.find('customers', sale.customer_id);
    if(c){
      const paid = Number(c.paid||0) + total;
      const purchases = Number(c.total_purchases||0) + total;
      this.update('customers', c.id, {total_purchases:purchases, paid:paid, balance: Math.max(0, Number(c.balance||0) + (payload.payment_method==='other'? total:0))});
    }
  }
  return sale;
};
Local.createPurchase = function(payload){
  this.load();
  const items = payload.items||[];
  if(!items.length) throw new Error(t('errors.required'));
  let total = 0;
  items.forEach(it=>{
    const p = this.find('products', it.product_id);
    if(!p) throw new Error(t('errors.notFound'));
    const qty = Number(it.quantity||0);
    this.update('products', p.id, {
      quantity: Number(p.quantity||0) + qty,
      purchase_price: it.purchase_price!=null?Number(it.purchase_price):p.purchase_price,
      sale_price: it.sale_price!=null?Number(it.sale_price):p.sale_price
    });
    it.total = qty * Number(it.purchase_price||0);
    it.name = it.name || p.name;
    total += it.total;
  });
  const purchase = this.insert('purchases', {
    supplier_id: payload.supplier_id||null, supplier_name: payload.supplier_name||'',
    number: payload.number||('PR-'+String(1000+this.nextId('purchases'))), date: payload.date||todayISO(),
    total, currency: payload.currency||state.currency, comment: payload.comment||'', items
  });
  this.insert('documents', {type:'purchase', number: purchase.number, date: purchase.date, party: purchase.supplier_name||'—', total, currency: purchase.currency, status:'paid', created_by:(state.user&&state.user.name)||'—'});
  return purchase;
};

/* ================= TOAST / MODAL ================= */
function toast(message, type){
  type = type || 'info';
  const icons = {success:'checkCircle', error:'alert', warning:'alert', info:'info'};
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = icon(icons[type]||'info') + '<span>'+escapeHtml(message)+'</span>';
  document.getElementById('toast-root').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(30px)'; el.style.transition='.3s'; setTimeout(()=>el.remove(), 300); }, 3200);
}
let modalState = { onOpen:null, onClose:null };
function openModal(html, opts){
  opts = opts || {};
  modalState.onClose = opts.onClose || null;
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-overlay" data-action="modal-overlay"><div class="modal '+(opts.size||'')+'" role="dialog" aria-modal="true">'+html+'</div></div>';
  document.body.style.overflow = 'hidden';
  if(opts.onOpen) opts.onOpen();
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
  document.body.style.overflow = '';
  if(modalState.onClose){ const cb = modalState.onClose; modalState.onClose = null; cb(); }
}

function bindCodeInputs(){
  const inputs = Array.prototype.slice.call(document.querySelectorAll('#code-inputs input'));
  inputs.forEach((inp, i)=>{
    inp.addEventListener('input', ()=>{
      inp.value = inp.value.replace(/\D/g,'').slice(0,1);
      inp.classList.toggle('filled', !!inp.value);
      if(inp.value && i<inputs.length-1) inputs[i+1].focus();
    });
    inp.addEventListener('keydown', (e)=>{
      if(e.key==='Backspace' && !inp.value && i>0) inputs[i-1].focus();
      if(e.key==='Enter') document.querySelector('[data-action="verify-code"]').click();
    });
    inp.addEventListener('paste', (e)=>{
      const txt = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'');
      if(txt){ e.preventDefault(); inputs.forEach((el,k)=>{ el.value=txt[k]||''; el.classList.toggle('filled', !!el.value); }); inputs[Math.min(txt.length, inputs.length-1)].focus(); }
    });
  });
  if(inputs[0]) inputs[0].focus();
}
let codeTimerId = null;
function startCodeTimer(){
  if(codeTimerId) clearInterval(codeTimerId);
  let sec = 60;
  const el = document.getElementById('code-timer');
  if(!el) return;
  el.textContent = '01:00';
  codeTimerId = setInterval(()=>{
    sec--;
    if(sec<=0){ clearInterval(codeTimerId); codeTimerId=null; el.textContent='00:00'; return; }
    el.textContent = pad(Math.floor(sec/60))+':'+pad(sec%60);
  }, 1000);
}

async function requestRegistration(){
  const phone = (state.reg.dial + ' ' + state.reg.phone).trim();
  state.reg.sessionId = uid();
  if(Api.enabled()){
    try{
      const res = await Api.request('/api/auth/request', {method:'POST', body:{
        phone, name:state.reg.name, company:state.reg.company, gender:state.reg.gender, region:state.reg.region, session_id:state.reg.sessionId
      }});
      if(res && res.session_id) state.reg.sessionId = res.session_id;
    }catch(e){ toast(e.message||t('errors.server'),'error'); if(!CONFIG.DEMO_FALLBACK) return; }
  }
  if(!Api.enabled()){ state.reg.demoCode = String(Math.floor(100000+Math.random()*900000)); }
  state.authStep = 'telegram';
  renderAuth();
}
async function verifyCode(){
  const code = readCode();
  if(code.length!==6){ toast(t('auth.enterCode'),'warning'); return; }
  if(Api.enabled()){
    try{
      const res = await Api.request('/api/auth/verify', {method:'POST', body:{registration_session_id:state.reg.sessionId, code}});
      state.token = res.token; state.user = res.user; state.company = res.company;
      persist(); await loadAllData(); state.authStep='done'; renderAuth(); toast(t('auth.done'),'success'); return;
    }catch(e){
      toast(e.code==='expired'?t('errors.expiredCode'):t('errors.invalidCode'),'error');
      if(!CONFIG.DEMO_FALLBACK) return;
    }
  }
  if(code === state.reg.demoCode){
    const phone = (state.reg.dial+' '+state.reg.phone).trim();
    state.user = {id:1, name: state.reg.name||'Эхсон', phone, gender:state.reg.gender, region:state.reg.region, company_id:1};
    state.company = {id:1, name: state.reg.company||'HORIZON MARKET', currency:state.currency, language:state.lang, owner_id:1};
    state.token = 'demo-token';
    persist(); await loadAllData();
    state.authStep='done'; renderAuth(); toast(t('auth.done'),'success');
  } else {
    toast(t('errors.invalidCode'),'error');
  }
}
async function resendCode(){
  if(Api.enabled()){
    try{ await Api.request('/api/auth/resend',{method:'POST',body:{registration_session_id:state.reg.sessionId}}); toast(t('auth.code.sent'),'success'); startCodeTimer(); return; }
    catch(e){ toast(e.message||t('errors.server'),'error'); }
  }
  state.reg.demoCode = String(Math.floor(100000+Math.random()*900000));
  toast(t('auth.demoCode',{code:state.reg.demoCode}),'info');
  startCodeTimer();
}

function buildRecentOps(){

  state.data.cash.filter(c=>c.type==='expense').forEach(c=>ops.push({title:t('doctype.expense')+' · '+(c.description||''), date:c.created_at, amount:c.amount, positive:false, icon:'wallet', color:'#FF4D4F'}));
  ops.sort((a,b)=> new Date(b.date)-new Date(a.date));
  return ops.slice(0,7);

function loadScript(src){
  return new Promise((resolve,reject)=>{
    if(document.querySelector('script[src="'+src+'"]')) return resolve();
    const s = document.createElement('script'); s.src=src; s.onload=resolve; s.onerror=reject; document.head.appendChild(s);
  });
}
function initChart(){
  const data = computeChart(state.chartPeriod);
  const canvas = document.getElementById('dash-chart');
  if(!canvas) return;
  const drawFallback = ()=>{
    const wrap = document.getElementById('chart-wrap');
    if(!wrap) return;
    wrap.innerHTML = svgLineChart(data);
  };
  if(window.Chart){ drawChartJS(canvas, data); return; }
  loadScript('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js').then(()=>{
    const c = document.getElementById('dash-chart');
    if(window.Chart && c) drawChartJS(c, data); else drawFallback();
  }).catch(drawFallback);
}
function drawChartJS(canvas, data){
  const ctx = canvas.getContext('2d');
  const g1 = ctx.createLinearGradient(0,0,0,300); g1.addColorStop(0,'rgba(22,119,255,.35)'); g1.addColorStop(1,'rgba(22,119,255,0)');
  const g2 = ctx.createLinearGradient(0,0,0,300); g2.addColorStop(0,'rgba(32,201,151,.3)'); g2.addColorStop(1,'rgba(32,201,151,0)');
  if(window._chart){ window._chart.destroy(); }
  window._chart = new Chart(ctx, {
    type:'line',
    data:{ labels:data.labels, datasets:[
      {label:t('dash.salesLegend'), data:data.sales, borderColor:'#1677FF', backgroundColor:g1, fill:true, tension:.38, borderWidth:3, pointRadius:0, pointHoverRadius:5},
      {label:t('dash.expensesLegend'), data:data.expenses, borderColor:'#FF4D4F', backgroundColor:'transparent', fill:false, tension:.38, borderWidth:2, borderDash:[5,4], pointRadius:0, pointHoverRadius:5},
      {label:t('dash.profitLegend'), data:data.profit, borderColor:'#20C997', backgroundColor:g2, fill:true, tension:.38, borderWidth:2.5, pointRadius:0, pointHoverRadius:5}
    ]},
    options:{ responsive:true, maintainAspectRatio:false, interaction:{mode:'index',intersect:false},
      plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:(c)=> c.dataset.label+': '+fmtMoney(c.parsed.y) } } },
      scales:{ x:{ grid:{display:false}, ticks:{color:'#93A3B8', maxRotation:0, autoSkip:true, maxTicksLimit:12} },
        y:{ grid:{color:'rgba(147,163,184,.18)'}, ticks:{color:'#93A3B8', callback:(v)=> fmtNum(v)} } }
    }
  });
}
function svgLineChart(data){
  const W=760,H=300,P=36;
  const max = Math.max(1, ...data.sales, ...data.expenses, ...data.profit);
  const n = data.labels.length;
  const x = i => P + (W-2*P) * (n<=1?0:i/(n-1));
  const y = v => H-P - (H-2*P) * (v/max);
  const path = arr => arr.map((v,i)=> (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:100%" preserveAspectRatio="none">'+
    [0,1,2,3,4].map(k=>'<line x1="'+P+'" y1="'+(P+(H-2*P)*k/4)+'" x2="'+(W-P)+'" y2="'+(P+(H-2*P)*k/4)+'" stroke="rgba(147,163,184,.18)"/>').join('')+
    '<path d="'+path(data.sales)+'" fill="none" stroke="#1677FF" stroke-width="3" stroke-linejoin="round"/>'+
    '<path d="'+path(data.profit)+'" fill="none" stroke="#20C997" stroke-width="2.5" stroke-linejoin="round"/>'+
    '<path d="'+path(data.expenses)+'" fill="none" stroke="#FF4D4F" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round"/>'+
    data.labels.map((l,i)=> (i%Math.ceil(n/8)===0? '<text x="'+x(i)+'" y="'+(H-10)+'" font-size="11" fill="#93A3B8" text-anchor="middle">'+escapeHtml(l)+'</text>':'')).join('')+
  '</svg>';
}

function customerAgg(id){
  const sales = state.data.sales.filter(s=>s.customer_id===id);
  const total = sales.reduce((a,s)=>a+fnum(s.total),0);
  const paid = sales.filter(s=>s.payment_method!=='other').reduce((a,s)=>a+fnum(s.total),0);
  return {count:sales.length, total, paid, debt:Math.max(0,total-paid)};
}

/* ================= GLOBAL SEARCH ================= */
function globalSearch(q){
  q = q.trim().toLowerCase(); if(!q) return [];
  const res = [];
  state.data.products.forEach(p=>{ if(matchQ(p.name,q)||matchQ(p.sku,q)) res.push({icon:'box', title:p.name, sub:t('nav.warehouse'), route:'warehouse'}); });
  state.data.customers.forEach(c=>{ if(matchQ(c.name,q)||matchQ(c.phone,q)) res.push({icon:'user', title:c.name, sub:t('nav.customers'), route:'customers'}); });
  state.data.suppliers.forEach(s=>{ if(matchQ(s.name,q)||matchQ(s.phone,q)) res.push({icon:'truck', title:s.name, sub:t('nav.suppliers'), route:'suppliers'}); });
  state.data.dealers.forEach(d=>{ if(matchQ(d.name,q)||matchQ(d.company,q)) res.push({icon:'handshake', title:d.name, sub:t('nav.dealers'), route:'dealers'}); });
  state.data.documents.forEach(d=>{ if(matchQ(d.number,q)||matchQ(d.party,q)) res.push({icon:'file', title:d.number, sub:docTypeLabel(d.type)+' · '+(d.party||''), route:'documents'}); });
  state.data.sales.forEach(s=>{ if(matchQ('SALE-'+s.id,q)) res.push({icon:'cart', title:'SALE-'+s.id, sub:t('nav.sales'), route:'sales'}); });
  return res.slice(0,12);
}
function renderSearchResults(q){
  const box = document.getElementById('search-results'); if(!box) return;
  const res = globalSearch(q);
  if(!q.trim()){ box.classList.add('hidden'); box.innerHTML=''; return; }
  box.classList.remove('hidden');
  box.innerHTML = res.length? res.map(r=>'<div class="sr-item" data-action="search-go" data-route="'+r.route+'"><div class="ic">'+icon(r.icon)+'</div><div class="grow"><b>'+escapeHtml(r.title)+'</b><div class="small muted">'+escapeHtml(r.sub)+'</div></div></div>').join('') : '<div class="search-empty">'+t('errors.notFound')+'</div>';
}

/* ================= REPORTS (с фильтром периода) ================= */
function computeReports(){
  const from = state.filters.repFrom? new Date(state.filters.repFrom+'T00:00:00') : null;
  const to = state.filters.repTo? new Date(state.filters.repTo+'T23:59:59') : null;
  const inRange = dt => { const d = new Date(dt); if(from && d<from) return false; if(to && d>to) return false; return true; };
  const sales = state.data.sales.filter(s=>inRange(s.created_at));
  const purchases = state.data.purchases.filter(p=>inRange(p.created_at));
  const cash = state.data.cash.filter(c=>inRange(c.created_at));
  const salesTotal = sales.reduce((a,s)=>a+fnum(s.total),0);
  const purchasesTotal = purchases.reduce((a,p)=>a+fnum(p.total),0);
  const expenseTotal = cash.filter(c=>c.type==='expense').reduce((a,c)=>a+fnum(c.amount),0);
  const incomeTotal = cash.filter(c=>c.type==='income').reduce((a,c)=>a+fnum(c.amount),0);
  const debt = state.data.customers.reduce((a,c)=>a+Math.max(0,fnum(c.balance)),0);
  const supDebt = state.data.suppliers.reduce((a,c)=>a+Math.max(0,fnum(c.balance)),0);
  return {
    sales:{count:sales.length, total:salesTotal},
    purchases:{count:purchases.length, total:purchasesTotal},
    warehouse:{count:state.data.products.length, qty:state.data.products.reduce((a,p)=>a+fnum(p.quantity),0), value:state.data.products.reduce((a,p)=>a+fnum(p.quantity)*fnum(p.sale_price),0)},
    profit:{sales:salesTotal, expenses:expenseTotal, profit:salesTotal-expenseTotal},
    expenses:{total:expenseTotal},
    customerDebts:{total:debt, items:state.data.customers.filter(c=>fnum(c.balance)>0)},
    supplierDebts:{total:supDebt, items:state.data.suppliers.filter(s=>fnum(s.balance)>0)},
    cashflow:{balance:incomeTotal-expenseTotal, income:incomeTotal, expense:expenseTotal},
    dealers:{count:state.data.dealers.length, active:state.data.dealers.filter(x=>x.status==='active').length}
  };
}

function onChange(e){
  const el = e.target;
  if(el.id==='reg-country'){ const c=COUNTRIES.find(x=>x.code===el.value); state.reg.country=el.value; state.reg.dial=c?c.dial:'+992'; return; }
  if(el.name==='reg-gender'){ state.reg.gender=el.value; document.querySelectorAll('.radio').forEach(r=>r.classList.remove('checked')); const lab=el.closest('.radio'); if(lab) lab.classList.add('checked'); return; }
  if(el.name==='u-gender'){ document.querySelectorAll('.radio').forEach(r=>r.classList.remove('checked')); const lab=el.closest('.radio'); if(lab) lab.classList.add('checked'); return; }
  if(el.id==='flt-whCat'){ state.filters.whCat=el.value; const c=document.getElementById('wh-list'); if(c) c.innerHTML=warehouseListHTML(); return; }
  if(el.id==='flt-whStatus'){ state.filters.whStatus=el.value; const c=document.getElementById('wh-list'); if(c) c.innerHTML=warehouseListHTML(); return; }
  if(el.closest('#sale-items') || ['sale-customer','sale-currency','sale-payment','sale-discount','sale-tax','sale-comment'].indexOf(el.id)>=0){ handleSaleChange(el); return; }
  if(el.closest('#pur-items') || ['pur-supplier','pur-number','pur-date','pur-currency','pur-comment'].indexOf(el.id)>=0){ handlePurchaseChange(el); return; }
  if(el.closest('#doc-items') || ['doc-type','doc-number','doc-date','doc-party','doc-currency','doc-status','doc-comment'].indexOf(el.id)>=0){ handleDocChange(el); return; }
}
function handleSaleChange(el){
  if(el.classList && el.classList.contains('li-prod')){
    readSaleDraft();
    const rows=Array.prototype.slice.call(document.querySelectorAll('#sale-items .li-row')); const idx=rows.indexOf(el.closest('.li-row'));
    const p=state.data.products.find(x=>x.id===Number(saleDraft.items[idx].product_id));
    if(p) saleDraft.items[idx].price=p.sale_price;
    renderSaleModal(); return;
  }
  readSaleDraft(); renderSaleModal();
}
function handlePurchaseChange(el){
  if(el.classList && el.classList.contains('li-prod')){
    readPurchaseDraft();
    const rows=Array.prototype.slice.call(document.querySelectorAll('#pur-items .li-row')); const idx=rows.indexOf(el.closest('.li-row'));
    const p=state.data.products.find(x=>x.id===Number(purchaseDraft.items[idx].product_id));
    if(p){ purchaseDraft.items[idx].purchase_price=p.purchase_price; purchaseDraft.items[idx].sale_price=p.sale_price; }

function setupPWA(){
  try{
    const manifest = {name:'OK-Mobile Бухгалтерия', short_name:'OK-Mobile', start_url:'.', display:'standalone',
      background_color:'#F5F8FC', theme_color:'#1677FF', orientation:'any',
      icons:[{src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231677FF'/%3E%3Ctext x='256' y='330' font-family='Arial' font-size='200' font-weight='bold' fill='white' text-anchor='middle'%3EOK%3C/text%3E%3C/svg%3E", sizes:'any', type:'image/svg+xml', purpose:'any maskable'}]};
    const link = document.getElementById('app-manifest');
    if(link) link.href = 'data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
  }catch(e){}
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    try{
      const swCode = "self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(caches.open('okm-v1').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone());}catch(_){}return res;}).catch(()=>c.match(e.request)))));});";
      const url = URL.createObjectURL(new Blob([swCode],{type:'text/javascript'}));
      navigator.serviceWorker.register(url).catch(()=>{});
    }catch(e){}
  }
}
function showOffline(){ if(document.querySelector('.offline-bar')) return; const el=document.createElement('div'); el.className='offline-bar'; el.innerHTML=icon('alert')+'<span>'+t('offline')+'</span>'; document.body.appendChild(el); }
function init(){
  restore(); applyTheme(); setupPWA();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  window.addEventListener('online', ()=>{ toast(t('online'),'success'); const b=document.querySelector('.offline-bar'); if(b) b.remove(); });
  window.addEventListener('offline', showOffline);
  if(!navigator.onLine) showOffline();

  else { renderAuth(); }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', init); else init();

</script>
<script>
/* ============================================================
   OK-Mobile 2026 — UI Enhancements layer
   Дополняет существующую логику, не изменяя её.
   ============================================================ */
(function(){
  'use strict';
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- Quick actions для Dashboard ---------- */
  window.quickActions = function(){
    var items = [
      {a:'new-sale',      icon:'cart',    color:'#1677FF', key:'sales.new'},
      {a:'new-purchase',  icon:'download',color:'#10B981', key:'purchases.new'},
      {a:'edit-product',  icon:'box',     color:'#F59E0B', key:'warehouse.new'},
      {a:'edit-customer', icon:'users',   color:'#7C3AED', key:'customers.new'},
      {a:'cash-in',       icon:'arrowDown',color:'#0EA5E9', key:'cash.addIncome'},
      {a:'cash-out',      icon:'arrowUp', color:'#EF4444', key:'cash.addExpense'}
    ];
    return items.map(function(x){
      return '<button class="qa" data-action="'+x.a+'">'+
        '<span class="qa-ic" style="background:'+x.color+'1A;color:'+x.color+'">'+icon(x.icon)+'</span>'+
        '<b>'+t(x.key)+'</b></button>';
    }).join('');
  };

  /* ---------- Sidebar: переезжающий active indicator ---------- */
  function updateNavIndicator(){
    var nav = document.querySelector('.side-nav');
    if(!nav) return;
    var ind = nav.querySelector('.nav-indicator');
    var active = nav.querySelector('.side-item.active');
    if(!active){ if(ind) ind.style.opacity='0'; return; }
    if(!ind){ ind = document.createElement('div'); ind.className='nav-indicator'; ind.style.opacity='1'; ind.style.transition='none'; nav.appendChild(ind); requestAnimationFrame(function(){ ind.style.transition=''; }); }
    var nr = nav.getBoundingClientRect();
    var ar = active.getBoundingClientRect();
    ind.style.height = ar.height + 'px';
    ind.style.transform = 'translateY(' + (ar.top - nr.top + nav.scrollTop) + 'px)';
    ind.style.opacity = '1';
  }

  /* ---------- Sidebar: кнопка сворачивания ---------- */
  function ensureCollapseBtn(){
    var brand = document.querySelector('.sidebar .side-brand');
    if(!brand || brand.querySelector('.collapse-btn')) return;
    var b = document.createElement('button');
    b.className = 'collapse-btn';
    b.setAttribute('data-action','toggle-sidebar');
    b.setAttribute('title','Toggle sidebar');
    b.innerHTML = icon('chevronDown');
    b.style.transform = 'rotate(90deg)';
    brand.appendChild(b);
  }

  /* ---------- Mobile FAB ---------- */
  function ensureFab(){
    var shell = document.querySelector('.shell');
    if(!shell){ var f=document.querySelector('.fab'); if(f) f.remove(); return; }
    if(!document.querySelector('.fab')){
      var fab = document.createElement('button');
      fab.className = 'fab';
      fab.setAttribute('data-action','new-sale');
      fab.setAttribute('aria-label', (window.t ? t('sales.new') : 'New sale'));
      fab.innerHTML = icon('plus');
      document.body.appendChild(fab);
    }
  }

  /* ---------- MutationObserver: поддерживаем UI в актуальном состоянии ---------- */
  var scheduled = false;
  function refresh(){
    if(scheduled) return; scheduled = true;
    requestAnimationFrame(function(){
      scheduled = false;
      ensureCollapseBtn(); ensureFab(); updateNavIndicator();
    });
  }
  var root = document.getElementById('root');
  if(root){
    new MutationObserver(refresh).observe(root, {childList:true, subtree:true});
  }
  window.addEventListener('resize', updateNavIndicator);

  /* ---------- Дополнительные data-action обработчики (capture) ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest && e.target.closest('[data-action]');
    if(!el) return;
    var action = el.getAttribute('data-action');
    if(action === 'toggle-sidebar'){
      e.preventDefault();
      document.body.classList.toggle('sidebar-collapsed');
      setTimeout(updateNavIndicator, 60);
      setTimeout(updateNavIndicator, 300);
    }
    if(action === 'toggle-theme' || action === 'set-theme'){
      var html = document.documentElement;
      html.classList.add('theme-switching');
      setTimeout(function(){ html.classList.remove('theme-switching'); }, 340);
    }
  }, true);

  /* ---------- Skeleton loading при первичной загрузке данных ---------- */
  function skeletonHTML(){
    return '<div class="sk-shell"><div class="sk-side"></div><div class="sk-main">'+
      '<div class="skeleton" style="width:220px;height:26px;margin-bottom:16px"></div>'+
      '<div class="sk-stats">'+
        '<div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div>'+
        '<div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div><div class="skeleton sk-stat"></div>'+
      '</div><div class="skeleton sk-block"></div></div></div>';
  }
  function showSkeleton(){
    var r = document.getElementById('root');
    if(r && !r.querySelector('.shell') && !r.querySelector('.auth')) r.innerHTML = skeletonHTML();
  }
  if(typeof window.loadAllData === 'function'){
    var origLoad = window.loadAllData;
    window.loadAllData = function(){
      var timer = setTimeout(showSkeleton, 180);
      var out;
      try { out = origLoad.apply(this, arguments); }
      catch(err){ clearTimeout(timer); throw err; }
      return Promise.resolve(out).then(function(v){ clearTimeout(timer); return v; },
                                       function(err){ clearTimeout(timer); throw err; });
    };
  }

  /* ---------- Инициализация ---------- */
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', refresh);
  else refresh();
})();
</script>
</body>
</html>
